## SONIQ Yealink Provisioning CFG Template
## Variables: {{username}}, {{password}}, {{identity}}, {{org_slug}},
##            {{display_name}}, {{action_base_url}}, {{cert_url}}
##
## Served by: /api/provisioning/cfg/{mac}

## ─── SIP Account 1: Primary (sip-lhr-1) ───
account.1.enable = 1
account.1.label = {{display_name}}
account.1.display_name = {{display_name}}
account.1.auth_name = {{username}}
account.1.user_name = {{username}}
account.1.password = {{password}}
account.1.sip_server.1.address = sip-lhr-1.soniqlabs.co.uk
account.1.sip_server.1.port = 5080
account.1.sip_server.1.transport_type = 3
account.1.sip_server.1.expires = 60
account.1.sip_server.1.retry_counts = 3
## ─── SIP Account 1: Failover (sip-man-1) ───
account.1.sip_server.2.address = sip-man-1.soniqlabs.co.uk
account.1.sip_server.2.port = 5080
account.1.sip_server.2.transport_type = 3
account.1.sip_server.2.expires = 60
account.1.sip_server.2.retry_counts = 3
account.1.fallback.redundancy_type = 1
account.1.fallback.timeout = 120

## ─── TLS ───
security.trust_certificates = 1
account.1.srtp_encryption = 1
trusted_certificates.url = {{cert_url}}

## ─── Action URLs: Button Presses → soniq-router via actions.go ───
## Mute key
action_url.setup_completed = {{action_base_url}}/{{identity}}/boot
features.action_uri.mute = {{action_base_url}}/{{identity}}/mute
features.action_uri.unmute = {{action_base_url}}/{{identity}}/unmute
features.action_uri.hold = {{action_base_url}}/{{identity}}/hold
features.action_uri.unhold = {{action_base_url}}/{{identity}}/unhold
features.action_uri.dnd_on = {{action_base_url}}/{{identity}}/dnd?state=on
features.action_uri.dnd_off = {{action_base_url}}/{{identity}}/dnd?state=off
features.action_uri.transfer = {{action_base_url}}/{{identity}}/transfer
features.action_uri.forward = {{action_base_url}}/{{identity}}/forward
## ─── Programmable Keys / DSS Keys (Lilly action chips pushed here) ───
## These get overwritten at runtime via HTTP XML push from soniq-router.
## Initial config sets them to speed dial / BLF.
programablekey.1.type = 16
programablekey.1.label = Park
programablekey.1.value = {{action_base_url}}/{{identity}}/park
programablekey.2.type = 16
programablekey.2.label = Pickup
programablekey.2.value = {{action_base_url}}/{{identity}}/pickup
programablekey.3.type = 16
programablekey.3.label = Conf
programablekey.3.value = {{action_base_url}}/{{identity}}/conference

## ─── Soft Keys: Lilly XML prompt responses use keys 1 + 4 ───
## Key 1 = Yes/Confirm, Key 4 = No/Cancel
## XML TextScreen pushed from soniq-router, key press fires action URL
## Pattern: /actions/{identity}/xml-response/{prompt_id}/{key_number}

## ─── XML Browser (for Lilly prompts on screen) ───
features.xml_browser.enable = 1

## ─── General ───
local_time.time_zone = +0
local_time.ntp_server1 = pool.ntp.org
phone_setting.ring_type = Ring1.wav
